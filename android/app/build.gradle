plugins { id 'com.android.application' }

android {
    namespace 'com.karim.frame'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }

    defaultConfig {
        applicationId 'com.karim.frame'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncFrameWeb', Copy) {
    from('../../web') {
        include 'index.html', 'app.js', 'manifest.webmanifest', 'icon.svg', 'sw.js'
    }
    into 'src/main/assets/frame'
}

tasks.named('preBuild').configure { dependsOn 'syncFrameWeb' }
