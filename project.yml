name: UMDVideoPlayer

options:
  bundleIdPrefix: com.karim
  deploymentTarget:
    iOS: "16.0"

targets:
  UMDVideoPlayer:
    type: application
    platform: iOS
    sources:
      - ContentView.swift
      - GeneralVideoPlayerScreen.swift
      - FrameBrowserPage.swift
      - FrameIPTVPage.swift
      - FrameSettingsPage.swift
      - UMDVideoPlayerApp.swift
      - PSPControllerManager.swift
      - UMDVideoISOReader.swift
      - UMDVideoPlayerScreen.swift
      - UMDVideoPlayerBridge.c
      - UMDVideoPlayerPlatform.m
      - UMDVideoCore/src/app/backdrop.c
      - UMDVideoCore/src/app/backdrop_png.c
      - UMDVideoCore/src/app/disc.c
      - UMDVideoCore/src/app/infosheet.c
      - UMDVideoCore/src/app/intro.c
      - UMDVideoCore/src/app/library.c
      - UMDVideoCore/src/app/main.c
      - UMDVideoCore/src/app/manual.c
      - UMDVideoCore/src/app/manual_png.c
      - UMDVideoCore/src/app/menu.c
      - UMDVideoCore/src/app/osd.c
      - UMDVideoCore/src/app/player.c
      - UMDVideoCore/src/app/resume.c
      - UMDVideoCore/src/app/screen.c
      - UMDVideoCore/src/app/settings.c
      - UMDVideoCore/src/app/sfx.c
      - UMDVideoCore/src/core/canvas.c
      - UMDVideoCore/src/core/cropdetect.c
      - UMDVideoCore/src/core/deint.c
      - UMDVideoCore/src/core/demux.c
      - UMDVideoCore/src/core/disc_image.c
      - UMDVideoCore/src/core/font8x8.c
      - UMDVideoCore/src/core/h264.c
      - UMDVideoCore/src/core/h264_cabac_tables.c
      - UMDVideoCore/src/core/h264dec.c
      - UMDVideoCore/src/core/h264dec_deblock.c
      - UMDVideoCore/src/core/h264dec_recon.c
      - UMDVideoCore/src/core/h264dec_slice.c
      - UMDVideoCore/src/core/hash.c
      - UMDVideoCore/src/core/icons.c
      - UMDVideoCore/src/core/iso9660.c
      - UMDVideoCore/src/core/jpeg.c
      - UMDVideoCore/src/core/mpeg_ps.c
      - UMDVideoCore/src/core/png.c
      - UMDVideoCore/src/core/rco.c
      - UMDVideoCore/src/core/sfo.c
      - UMDVideoCore/src/core/umdv.c
      - UMDVideoCore/src/core/vag.c
      - UMDVideoCore/src/core/vsmx.c
      - UMDVideoCore/src/core/vtiming.c
      - UMDVideoCore/src/core/yuv.c
      - UMDVideoCore/src/core/atrac3p/at3p.c
      - UMDVideoCore/src/core/atrac3p/atrac.c
      - UMDVideoCore/src/core/atrac3p/atrac3plus.c
      - UMDVideoCore/src/core/atrac3p/atrac3plusdsp.c
      - UMDVideoCore/src/platform/posix/posix_sys.c
      - UMDVideoCore/src/platform/macos/mac_video.c
      - UMDVideoCore/src/platform/macos/mac_audio.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karim.umdvideoplayer
        PRODUCT_NAME: UMDVideoPlayer
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: UMDVideoPlayer-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/UMDVideoCore/src"
          - "$(SRCROOT)/UMDVideoCore/src/core"
          - "$(SRCROOT)/UMDVideoCore/src/app"
          - "$(SRCROOT)/UMDVideoCore/src/platform"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "UMD Video"

    resources:
      - UMDVideoCore/LICENSE
      - UMDVideoCore/NOTICE
      - UMDVideoCore/src/core/atrac3p/COPYING.LGPLv2.1
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: libm.tbd
