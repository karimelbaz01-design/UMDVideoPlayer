name: FRAME Repository Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check repository sources and embedded engine
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-frame-sources.py
          node --check web/app.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
          bash -n scripts/prepare-psp-engine.sh
      - name: Check UMD bridge C syntax on Linux
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          clang -std=c11 -fsyntax-only \
            -I. \
            -IUMDVideoCore/src \
            -IUMDVideoCore/src/core \
            -IUMDVideoCore/src/platform \
            UMDVideoPlayerBridge.c

      - name: Parse native Swift sources on Linux
        shell: bash
        run: |
          set -euo pipefail
          command -v swiftc
          swiftc -version
          while IFS= read -r file; do
            echo "Parsing $file"
            swiftc -frontend -parse "$file"
          done < <(find . -maxdepth 1 -name "*.swift" -type f | sort)
      - name: Report validation result
        if: always()
        run: echo "This checks repository consistency, NOT iOS compilation or PSP gameplay."
