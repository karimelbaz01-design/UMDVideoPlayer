name: FRAME Web Test Package

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frame-web-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and manifest
        run: |
          set -e
          node --check web/app.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
          test -s web/index.html
      - name: Bundle portable FRAME Web
        run: |
          mkdir -p dist
          cp -R web/. dist/
          cat > dist/TESTING.txt <<'EOF'
          FRAME Web test build.
          For a full Safari test use an HTTPS host or local web server.
          GitHub Actions artifact can be downloaded without GitHub Pages.
          PSP and UMD Video playback are not implemented in the Web build.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-Web-Test
          path: dist/
          retention-days: 14
