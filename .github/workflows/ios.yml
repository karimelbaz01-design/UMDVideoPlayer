name: Build UMD Video Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.swift'
      - '**/*.m'
      - '**/*.c'
      - '**/*.h'
      - 'project.yml'
      - 'Info.plist'
      - '.gitmodules'
      - 'UMDVideoCore'
      - '.github/workflows/ios.yml'

# Only the newest commit needs a simulator build; cancel stale queued or running validations.
concurrency:
  group: umd-video-ios-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository and playback engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify playback engine checkout
        run: |
          git submodule status
          test -f UMDVideoCore/src/platform/platform.h
          test -f UMDVideoCore/src/app/main.c

      - name: Show Apple build environment
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated Xcode project
        run: |
          xcodebuild -list -project UMDVideoPlayer.xcodeproj

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project UMDVideoPlayer.xcodeproj \
            -scheme UMDVideoPlayer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UMDVideoPlayer-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload iOS Simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UMDVideoPlayer-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/UMDVideoPlayer.app
          if-no-files-found: error
          retention-days: 7
