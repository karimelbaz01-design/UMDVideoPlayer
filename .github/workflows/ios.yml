
name: Build UMD Video Player

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project UMDVideoPlayer.xcodeproj \
            -scheme UMDVideoPlayer \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload app build
        uses: actions/upload-artifact@v4
        with:
          name: UMDVideoPlayer-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/UMDVideoPlayer.app
