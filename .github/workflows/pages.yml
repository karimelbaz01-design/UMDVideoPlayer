name: Publish FRAME Web
# Deploy FRAME UMD v23 PES extraction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: frame-web-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          touch _site/.nojekyll
      - name: Install pinned FFmpeg cinema assets
        run: |
          mkdir -p /tmp/frame-ffmpeg _site/ffmpeg-cinema/ffmpeg _site/ffmpeg-cinema/core
          cd /tmp/frame-ffmpeg
          npm pack @ffmpeg/ffmpeg@0.12.15
          npm pack @ffmpeg/core@0.12.10
          tar -xzf ffmpeg-ffmpeg-0.12.15.tgz
          cp -R package/dist/esm/. "$GITHUB_WORKSPACE/_site/ffmpeg-cinema/ffmpeg/"
          rm -rf package
          tar -xzf ffmpeg-core-0.12.10.tgz
          cp package/dist/esm/ffmpeg-core.js package/dist/esm/ffmpeg-core.wasm "$GITHUB_WORKSPACE/_site/ffmpeg-cinema/core/"
          test -s "$GITHUB_WORKSPACE/_site/ffmpeg-cinema/core/ffmpeg-core.wasm"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact not visible after 100 seconds"
          exit 1
      - name: Allow Pages metadata propagation
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
