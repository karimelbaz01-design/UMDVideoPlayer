name: Publish FRAME Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frame-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frame-web-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FRAME Web files
        run: |
          test -s web/index.html
          test -s web/app.js
          test -s web/manifest.webmanifest
          node --check web/app.js
          python3 -m json.tool web/manifest.webmanifest >/dev/null
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
