name: Publish FRAME web test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frame-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: frame-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate FRAME site files
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/atrac3plus-test.html
          test -s web/frame-atrac3plus-native.js
          test -s web/frame-atrac3plus-wasm.js
          test -s web/frame-atrac3plus-wasm.wasm
          touch web/.nojekyll
          echo "FRAME site contents:"
          ls -lah web/index.html web/atrac3plus-test.html web/frame-atrac3plus-wasm.*
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' 2>/dev/null || echo 0)
            echo "Artifact visibility attempt $attempt: $count"
            if [ "$count" -gt 0 ]; then
              sleep 10
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pages artifact not visible through GitHub API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnose Pages deployment URL and configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,status,source}' || true
      - name: Verify published FRAME endpoints
        shell: bash
        run: |
          set -euo pipefail
          for route in index.html atrac3plus-test.html frame-atrac3plus-native.js frame-atrac3plus-wasm.js frame-atrac3plus-wasm.wasm; do
            base="${{ steps.deployment.outputs.page_url }}"
            url="${base%/}/$route"
            echo "Checking $url"
            success=0
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then success=1; break; fi
              echo "Attempt $attempt: HTTP $code"
              sleep 10
            done
            if [ "$success" -ne 1 ]; then
              echo "::error::Published FRAME route $route is not accessible"
              exit 1
            fi
          done
