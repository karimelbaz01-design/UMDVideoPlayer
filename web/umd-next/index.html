<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMD Video Player (Web Prototype)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #181b22;
      --accent: #00a8ff;
      --text: #e6e8ec;
      --muted: #8b92a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 1.2rem; font-weight: 600; }
    .file-btn {
      background: var(--accent);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-block;
    }
    .file-btn input { display: none; }
    .screen-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }
    button {
      background: #262b36;
      color: var(--text);
      border: 1px solid #353b4a;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #313846; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PSP UMD Video Player (WASM + WebCodecs)</h1>
      <label class="file-btn">
        Carica file .ISO
        <input type="file" id="isoInput" accept=".iso,.ISO" />
      </label>
    </header>

    <div class="screen-wrap">
      <canvas id="videoCanvas" width="480" height="272"></canvas>
    </div>

    <div class="controls">
      <button id="playPauseBtn" disabled>Pausa</button>
      <input type="range" id="seekBar" min="0" max="7200" value="0" step="1" disabled />
      <span id="timeLabel">00:00</span>
    </div>

    <div class="status">
      <span id="statusText">In attesa di un file .ISO UMD Video...</span>
      <span id="resLabel">480x272</span>
    </div>
  </div>
  <section id="bootDiagnostics" style="width:100%;max-width:820px;margin-top:12px;padding:14px;background:#192635;color:#e3f0ff;border-radius:10px;font:14px/1.5 monospace;overflow-wrap:anywhere">FRAME diagnostica Stop v101 — pagina aggiornata. In attesa del motore…</section>

  <script>
    window.addEventListener('error', (event) => {
      const el = document.getElementById('bootDiagnostics');
      if (el) el.textContent = 'Errore JavaScript: ' + (event.message || 'sconosciuto');
    });
    window.addEventListener('unhandledrejection', (event) => {
      const el = document.getElementById('bootDiagnostics');
      if (el) el.textContent = 'Errore caricamento: ' + String(event.reason);
    });
  </script>
  <script type="module" src="player.js?v=halt-679ffd2a"></script>
</body>
</html>
